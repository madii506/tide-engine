<body>
<canvas id="water" aria-hidden="true"></canvas>
<div class="page">
<header class="mast">
  <a class="mark" href="/" aria-label="TIDE home"><img class="drop" src="/assets/img/drop.png" alt="" width="235" height="360"><span class="ring" aria-hidden="true"></span><span class="ring r2" aria-hidden="true"></span></a>
  <div class="word"><a href="/" aria-label="TIDE"><span class="ch" style="--i:0" aria-hidden="true">T</span><span class="ch" style="--i:1" aria-hidden="true">I</span><span class="ch" style="--i:2" aria-hidden="true">D</span><span class="ch" style="--i:3" aria-hidden="true">E</span></a></div>
  <nav class="nav" aria-label="Main"><a href="/">/home</a><a href="/launch">/launch</a><a href="/explore">/explore</a><a data-x href="https://x.com/" target="_blank" rel="noopener">/twitter</a></nav>
  <div class="stats" aria-live="polite">
    <span class="st">Tides <span class="v" id="sTides">—</span></span><span class="dot">·</span>
    <span class="st">Seals <span class="v" id="sSeals">—</span></span><span class="dot">·</span>
    <span class="st">SOL sealed <span class="v" id="sSol">—</span></span>
  </div>
  <div class="engine" id="engine"><span class="pulse"></span><span>reading the engine…</span></div>
</header>
<main class="wide">
  <div class="ex-bar">
    <div class="tabs" role="tablist" aria-label="Sort tides">
      <button role="tab" data-sort="new" aria-selected="true">newest</button>
      <button role="tab" data-sort="sealed" aria-selected="false">most sealed</button>
      <button role="tab" data-sort="deep" aria-selected="false">deepest</button>
      <span class="ink" aria-hidden="true"></span>
    </div>
    <label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.3"/></svg><input class="inp" id="q" placeholder="name, ticker or CA" aria-label="Search tides"></label>
  </div>
  <div class="ex-meta"><span id="exCount">—</span><span id="exUpd"></span></div>
  <div class="grid anim" id="grid" aria-live="polite"></div>
</main>
<footer class="foot">

</footer>
